<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Unified Systems Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="login-brand-icon">U</div>
      <h1 class="login-title">Set New Password</h1>
      <p class="login-subtitle">Please enter your new password below.</p>
    </div>

    <div id="alert-box" class="alert" style="display: none;" role="alert"></div>

    <form id="reset-password-form">
      <div class="form-group">
        <label for="password" class="form-label">New Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      
      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm New Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        Reset Password
      </button>

      <div style="text-align: center; margin-top: 16px;">
        <a href="/" style="font-size: 0.85rem; color: var(--text-muted);">Back to Login</a>
      </div>
    </form>
  </div>

  <script>
    // Get token from URL query string
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('reset-password-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');

    if (!token) {
      alertBox.className = 'alert alert-danger';
      alertBox.textContent = 'Invalid or missing reset token.';
      alertBox.style.display = 'block';
      btnSubmit.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Passwords do not match.';
        alertBox.style.display = 'block';
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Resetting...';

      try {
        const res = await fetch(`/api/auth/reset-password/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = 'Password reset successfully. You can now login.';
          alertBox.style.display = 'block';
          form.reset();
          btnSubmit.style.display = 'none';
          
          setTimeout(() => {
            window.location.href = '/';
          }, 3000);
        } else {
          alertBox.className = 'alert alert-danger';
          alertBox.textContent = data.message || 'Failed to reset password.';
          alertBox.style.display = 'block';
          btnSubmit.disabled = false;
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Server communication error. Please try again later.';
        alertBox.style.display = 'block';
        btnSubmit.disabled = false;
      } finally {
        if(btnSubmit.style.display !== 'none') {
            btnSubmit.textContent = 'Reset Password';
        }
      }
    });
  </script>
</body>
</html>
