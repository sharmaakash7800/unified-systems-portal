<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Unified Systems Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="login-brand-icon">U</div>
      <h1 class="login-title">Forgot Password</h1>
      <p class="login-subtitle">Enter your email to receive a password reset link.</p>
    </div>

    <div id="alert-box" class="alert" style="display: none;" role="alert"></div>

    <form id="forgot-password-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        Send Reset Link
      </button>

      <div style="text-align: center; margin-top: 16px;">
        <a href="/" style="font-size: 0.85rem; color: var(--text-muted);">Back to Login</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('forgot-password-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Sending...';

      const email = document.getElementById('email').value;

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = 'Reset link sent to your email.';
          alertBox.style.display = 'block';
          form.reset();
        } else {
          alertBox.className = 'alert alert-danger';
          alertBox.textContent = data.message || 'Failed to send reset link.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Server communication error. Please try again later.';
        alertBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
