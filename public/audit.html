<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - Unified Systems Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">U</div>
        <div class="sidebar-title">Unified Systems</div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>

        <div id="admin-nav-section">
          <div class="nav-section-title">Administration</div>
          <a href="/users.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            Users
          </a>
          <a href="/roles.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            Roles & Permissions
          </a>
          <a href="/systems.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            System Registry
          </a>
          <a href="/audit.html" class="nav-link active">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Audit Logs
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button onclick="Auth.logout()" class="btn btn-secondary btn-sm" style="width: 100%; border: 1px solid #334155; background: #1e293b; color: #cbd5e1;">
          Sign Out
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="page-title">Enterprise Audit Trail</div>
        <div class="user-profile">
          <div class="user-info">
            <div class="user-name" id="topbar-user-name">-</div>
            <div class="user-role-badge" id="topbar-user-role">-</div>
          </div>
        </div>
      </header>

      <main class="content-area">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;">
          <div>
            <h2 style="font-size: 1.35rem; font-weight: 600;">System Activity & Audit Logs</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">
              Traceable records of administrative, user lifecycle, and authentication events.
            </p>
          </div>
          <button onclick="loadAuditLogs()" class="btn btn-secondary btn-sm">
            Refresh Logs
          </button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Actor Email</th>
                <th>Action</th>
                <th>Target Type</th>
                <th>Target ID</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="audit-tbody">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    async function loadAuditLogs() {
      const tbody = document.getElementById('audit-tbody');
      try {
        const res = await Auth.apiRequest('/api/audit-logs?limit=50');
        const data = await res.json();
        if (data.success) {
          tbody.innerHTML = '';
          if (data.logs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 32px;">No audit entries logged yet.</td></tr>`;
            return;
          }
          data.logs.forEach(log => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td style="color: var(--text-muted); font-size: 0.8rem; white-space: nowrap;">${new Date(log.timestamp).toLocaleString()}</td>
              <td style="font-weight: 500;">${log.userEmail || '-'}</td>
              <td><code>${log.action}</code></td>
              <td>${log.targetType}</td>
              <td style="font-size: 0.78rem; color: var(--text-muted);">${log.targetId || '-'}</td>
              <td style="font-size: 0.82rem; color: var(--text-sub);">${JSON.stringify(log.details || {})}</td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (e) {
        console.error('Failed to load audit logs:', e);
      }
    }

    (async function init() {
      const user = await Auth.checkAuthStatus();
      if (!user) {
        window.location.href = '/index.html';
        return;
      }
      Auth.renderUserNav();
      loadAuditLogs();
    })();
  </script>
</body>
</html>
